[project]
name = "firefinder"
version = "0.1.0"
description = "Wildfire and grid-corridor risk forecasting from public satellite and open data"
requires-python = ">=3.12"
dependencies = [
    # geo core
    "rasterio>=1.3",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "rioxarray>=0.17",
    "xarray>=2024.6",
    "h3>=4.0",
    # data access
    "pystac-client>=0.8",
    "osmium>=3.7",
    "requests>=2.32",
    "cdsapi>=0.7",
    "pyarrow>=17.0",
    # processing
    "numpy>=1.26",
    "pandas>=2.2",
    "dask[array]>=2024.6",
    # ML
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "shap>=0.46",
    # db
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
    "geoalchemy2>=0.15",
    # utils
    "typer>=0.12",
    "pydantic-settings>=2.4",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "jupyterlab>=4.2"]

[project.scripts]
firefinder = "firefinder.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["firefinder"]

[tool.ruff]
line-length = 100
